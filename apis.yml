description: Pharos is a healthcare technology company whose stated mission is to improve hospital
  quality and patient safety. Backed by Felicis, it operates a gated product application
  (app.pharos.health) and access-restricted documentation (docs.pharos.health requires an access
  code), indicating an enterprise offering sold to hospitals and health systems rather than a public,
  self-serve developer platform. As of this enrichment pass Pharos publishes a marketing site but no
  public API, OpenAPI specification, SDKs, developer portal, or other machine-readable developer
  surface. Surfaced as a portfolio company of Felicis and added to the API Evangelist network as a
  lead, this profile is retained for monitoring should a public API program emerge.
